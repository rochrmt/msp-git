<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8"/>

    <!-- Important: cache busting for index.html -->
    <meta http-equiv="cache-control" content="max-age=0"/>
    <meta http-equiv="cache-control" content="no-cache"/>
    <meta http-equiv="expires" content="0"/>
    <meta http-equiv="expires" content="Tue, 01 Jan 1980 1:00:00 GMT"/>
    <meta http-equiv="pragma" content="no-cache"/>

    <title>MSP-GED</title>

    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <link rel="icon" type="image/png" href="assets/favicon-96x96.png" sizes="96x96"/>

    <style>
      @keyframes bouncing-loader {
        from {
          opacity: 1;
          transform: translateY(0);
        }
        to {
          opacity: 0.1;
          transform: translateY(-1rem);
        }
      }
      .bouncing-loader {
        display: flex;
        justify-content: center;
        position: absolute;
        top: 50%;
        left: 50%;
      }
      .bouncing-loader > div {
        width: 1rem;
        height: 1rem;
        margin: 3rem 0.2rem;
        background: #8385aa;
        border-radius: 50%;
        animation: bouncing-loader 0.6s infinite alternate;
      }
      .bouncing-loader > div:nth-child(2) {
        animation-delay: 0.2s;
      }
      .bouncing-loader > div:nth-child(3) {
        animation-delay: 0.4s;
      }
      /* MSP-GED : agrandissement des logos (login + sidenav) */
      .adf-login-content .adf-img-logo,
      .adf-login-content img#adf-login-img-logo {
          display: block !important;
          margin-left: auto !important;
          margin-right: auto !important;
          height: 110px !important;
          width: auto !important;
          max-width: 100% !important;
      }
      .adf-login-content .adf-alfresco-logo img {
          max-height: 110px !important;
      }
      .aca-sidenav-header-title {
          height: 72px !important;
      }
      .aca-sidenav-header-title-logo img {
          height: 56px !important;
          transform: none !important;
      }
      .adf-app-title .adf-app-logo, .adf-app-logo {
          height: 50px !important;
      }
      .aca-sidenav-header {
          position: relative !important;
      }
      .aca-sidenav-header-title-text {
          display: none !important;
      }
      .aca-sidenav-header-title-logo {
          flex: 1 1 auto !important;
          min-width: 0 !important;
      }
      .aca-sidenav-header-title aca-toolbar {
          flex: 0 0 auto !important;
      }
      .aca-sidenav-header-title .aca-user-menu-button {
          visibility: visible !important;
          opacity: 1 !important;
      }
      .msp-aca-dashboard-link {
          position: absolute;
          right: 16px;
          bottom: 4px;
          left: 16px;
          z-index: 5;
          display: flex;
          align-items: center;
          justify-content: center;
          gap: 8px;
          height: 28px;
          border-radius: 6px;
          background: #1264a3;
          color: #fff !important;
          font: 600 12px/1 Arial, sans-serif;
          text-decoration: none !important;
          box-shadow: 0 2px 7px rgba(18, 100, 163, 0.24);
          transition: background 150ms ease, box-shadow 150ms ease;
      }
      .msp-aca-dashboard-link:hover,
      .msp-aca-dashboard-link:focus {
          background: #0a4d80;
          box-shadow: 0 4px 10px rgba(18, 100, 163, 0.3);
      }
      .msp-aca-dashboard-link svg {
          width: 16px;
          height: 16px;
          fill: currentColor;
      }
      .msp-aca-dashboard-link-compact {
          right: 8px;
          left: 8px;
      }
      .msp-aca-dashboard-link-compact span {
          display: none;
      }
    </style>
  <link rel="stylesheet" href="styles.css"></head>
  <body>
    <main>
      <app-root>
        <div class="bouncing-loader">
          <div></div>
          <div></div>
          <div></div>
        </div>
      </app-root>
    </main>

</html>
