# Override pour le developpement local (sans HTTPS/Traefik)
# Usage : docker compose -f docker-compose.yml -f docker-compose.local.yml up -d
# En production, utiliser docker-compose.yml seul (Traefik gere 80/443).

services:
  # Traefik n'est utile qu'en production (TLS Let's Encrypt) : on le desactive en local plus besoin en production 
  traefik:
    profiles: ["disabled-local"]

  # Proxy nginx local en HTTP simple sur le port 80
  proxy:
    image: nginx:stable-alpine
    mem_limit: 128m
    depends_on:
      - alfresco
      - solr6
      - share
      - content-app
    volumes:
      - ./config/nginx.conf:/etc/nginx/nginx.conf
      - ./config/nginx.htpasswd:/etc/nginx/conf.d/nginx.htpasswd
    ports:
      - ${BIND_IP_NGINX:-0.0.0.0}:80:80
    networks:
      - webproxy
    restart: unless-stopped
